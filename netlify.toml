# Hybrid frontend deployment configuration.
# Build variables are configured privately in the hosting environment.
[build]
  base = "frontend"
  publish = "dist-live"
  command = "npm ci --ignore-scripts --no-fund --no-audit && npm run build:live"

[build.environment]
  NODE_VERSION = "22.12.0"
  CI = "true"
  IGNITE_LIVE_BUILD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cdrxmelhysdqrccttsjg.supabase.co https://icp-api.io https://id.ai; frame-src https://id.ai; object-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'; manifest-src 'none'; media-src 'self' blob:"
