# Plain persistent actor: no install argument. The governor is read from the
# GOVERNOR_PRINCIPAL canister environment variable (fail-closed while unset).
# IGNITE_MEDIA_LARGE_CAPACITY=1 allows the 200 GiB stable-backed multi-Region mode; it only takes
# effect after the store is switched over (Enlarge Group 1 photo store workflow).
name: media_blob_store
recipe:
  type: "@dfinity/motoko@v5.1.0"
settings:
  environment_variables:
    GOVERNOR_PRINCIPAL: "gwyap-pqop5-msidu-vlkov-zuejr-7gqjr-dwvkx-2yhgy-mdaxt-2giwn-cae"
    IGNITE_MEDIA_LARGE_CAPACITY: "1"
