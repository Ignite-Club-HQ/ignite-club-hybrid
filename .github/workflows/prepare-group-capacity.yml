# Reads live usage (no deploy key), turns it into capacity evidence against the
# owner's tested limits, and queues CLOSED preparation requests at 70%.
# Never creates, installs or opens a group.
name: Prepare group capacity (closed requests)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: ignite-capacity-preparation-queue
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require tested limits
        id: limits
        run: |
          if test -f deploy/groups/tested-limits.json; then echo 'present=true' >> "$GITHUB_OUTPUT"
          else echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Add deploy/groups/tested-limits.json (see docs/scaling-capacity-policy.md); nothing queued.'
          fi
      - uses: actions/setup-node@v4
        if: steps.limits.outputs.present == 'true'
        with:
          node-version: '22.12.0'
      - name: Read live usage
        if: steps.limits.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/agentdeps" --no-fund --no-audit \
            @dfinity/agent@2.4.1 @dfinity/candid@2.4.1 @dfinity/principal@2.4.1
          NODE_PATH="$RUNNER_TEMP/agentdeps/node_modules" HEALTH_JSON_OUT="$RUNNER_TEMP/health.json" \
            node scripts/canister-health.mjs
      - name: Install frontend dependencies
        if: steps.limits.outputs.present == 'true'
        run: node scripts/ensure-frontend-deps.mjs
      - name: Build evidence and queue closed requests
        if: steps.limits.outputs.present == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --yes tsx@4 scripts/collect-group-capacity.ts "$RUNNER_TEMP/health.json" ../deploy/groups/tested-limits.json "$RUNNER_TEMP/evidence.json"
          npx --yes tsx@4 scripts/prepare-group-capacity.ts "$RUNNER_TEMP/evidence.json" ../deploy/groups/capacity-requests.json
      - name: Save requests
        if: steps.limits.outputs.present == 'true'
        run: |
          git config user.name 'ignite-capacity'
          git config user.email 'capacity@users.noreply.github.com'
          git add deploy/groups/capacity-requests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Queue closed capacity preparation'
            git push
          fi
