name: Stop Group 2 new clubs
on:
  workflow_dispatch:
    inputs:
      action:
        description: Check status or stop new Group 2 placements (never opens)
        type: choice
        required: true
        default: check
        options: [check, stop]
      expected_revision:
        description: Revision printed by check (required for stop)
        required: false
        default: ''
      confirmation:
        description: Type STOP GROUP 2 NEW CLUBS for stop
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  stop:
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install project dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Write existing administrator key
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PEM" || { echo "::error::Existing DEPLOYER_PEM required"; exit 1; }
          umask 077
          printf '%s' "$DEPLOYER_PEM" | tr -d '\r' | sed 's/\\n/\n/g' | sed -n '/-----BEGIN/,/-----END/p' > "$RUNNER_TEMP/group-stop.pem"
      - name: Check or stop new clubs
        env:
          ACTION: ${{ inputs.action }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npx --yes tsx@4 frontend/scripts/stop-group-placements.ts "$ACTION" "$EXPECTED_REVISION" "$RUNNER_TEMP/group-stop.pem" "$RUNNER_TEMP/group-stop-report.json"
      - name: Remove administrator key
        if: always()
        run: rm -f "$RUNNER_TEMP/group-stop.pem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-2-stop-report
          path: ${{ runner.temp }}/group-stop-report.json
          if-no-files-found: ignore