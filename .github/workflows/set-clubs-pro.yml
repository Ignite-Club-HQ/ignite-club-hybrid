# Ignite Club HQ — turn Pro on for every live club on the ICP backend.
#
# Run from the GitHub Actions tab: "Set all ICP clubs to Pro" → Run workflow.
# Uses the same DEPLOYER_PEM governor key as the deploy workflow — no new
# secrets needed. Safe to re-run: clubs already on Pro are unchanged.

name: Set all ICP clubs to Pro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install ICP SDK
        run: mkdir -p /tmp/icp-run && cd /tmp/icp-run && npm init -y >/dev/null && npm install @icp-sdk/core@^5.4.0 --no-fund --no-audit

      - name: Set Pro on all live clubs
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYER_PEM" ]; then
            echo "::error::The DEPLOYER_PEM repository secret is not set."
            exit 1
          fi
          cp scripts/set-all-clubs-pro.mjs /tmp/icp-run/
          node /tmp/icp-run/set-all-clubs-pro.mjs
