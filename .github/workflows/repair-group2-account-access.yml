name: Repair Group 2 account access
on:
  workflow_dispatch:
    inputs:
      action:
        description: Check, repair account access and refresh snapshot, or disable account eligibility
        required: true
        type: choice
        default: check
        options: [check, repair, disable]
      confirmation:
        description: REPAIR GROUP 2 ACCOUNT ACCESS or DISABLE GROUP 2 ACCOUNT ACCESS (empty for check)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate request and install pinned tools
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {validateRequest} from "./scripts/group2-admission-release-rules.mjs"; validateRequest(process.env.ACTION,process.env.CONFIRMATION)'
          npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm --no-fund --no-audit
          node scripts/ensure-frontend-deps.mjs
          echo "ICP_HOME=$RUNNER_TEMP/account-access-icp-home" >> "$GITHUB_ENV"
      - name: Test narrow admission and upgrade safeguards
        run: |
          set -euo pipefail
          cargo test -p identity_access
          node --test scripts/group2-admission-release-rules.test.mjs scripts/group2-admission-workflow.test.mjs scripts/group2-journal.test.mjs
      - name: Restore existing governor only
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PEM" || { echo "::error::Existing DEPLOYER_PEM required"; exit 1; }
          umask 077
          mkdir -p "$ICP_HOME/identity/keys"
          printf '%s' "$DEPLOYER_PEM" | tr -d '\r' | sed 's/\\n/\n/g' | sed -n '/-----BEGIN/,/-----END/p' > "$RUNNER_TEMP/account-access.pem"
          icp identity import --from-pem "$RUNNER_TEMP/account-access.pem" --storage plaintext ignite-governor
          icp identity default ignite-governor
          test "$(icp identity principal)" = vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae
      - name: Build only the identity recipe artifact
        working-directory: deploy/mainnet
        run: |
          set -euo pipefail
          icp build identity_access
          test -f .icp/cache/artifacts/identity_access
          cp .icp/cache/artifacts/identity_access "$RUNNER_TEMP/identity-access.wasm"
      - name: Resolve existing delivery identity for snapshot
        if: inputs.action == 'repair'
        env:
          ICP_PUSH_WORKER_SEED: ${{ secrets.ICP_PUSH_WORKER_SEED }}
          PUSH_WORKER_PRINCIPAL: ${{ vars.PUSH_WORKER_PRINCIPAL }}
        run: bash scripts/resolve-group-push-worker.sh
      - name: Check or repair the existing identity only
        working-directory: frontend
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: npx --yes tsx@4 scripts/repair-group2-admission.ts "$ACTION" "$RUNNER_TEMP/identity-access.wasm" "$RUNNER_TEMP/account-access.pem" "$RUNNER_TEMP/account-access-report"
      - name: Refresh verified live routing snapshot
        if: inputs.action == 'repair'
        working-directory: frontend
        run: npx --yes tsx@4 scripts/produce-routing-gates.ts "$RUNNER_TEMP/account-access.pem" "$RUNNER_TEMP/account-access-report/routing-gates-report.json"
      - name: Save verified snapshot
        if: inputs.action == 'repair'
        run: |
          set -euo pipefail
          git config user.name "ignite-governor-bot"
          git config user.email "noreply@igniteclubhq.app"
          git add frontend/src/live/generated/routingGates.ts
          git diff --cached --quiet || git commit -m "chore: verified Group 2 account access snapshot [skip ci]"
          git push
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/account-access.pem"; rm -rf "$ICP_HOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-2-account-access-report
          path: ${{ runner.temp }}/account-access-report
          if-no-files-found: ignore