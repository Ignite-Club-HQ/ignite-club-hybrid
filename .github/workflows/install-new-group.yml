# Create, install and configure a NEW club group on mainnet, kept CLOSED.
# Signs with DEPLOYER_PEM. Spends cycles from the deploy identity (about
# 1.6T per service, 12 services). Never registers or opens the group, never
# touches existing canisters' code. Re-run to resume after any interruption.
name: Install new group (closed)

on:
  workflow_dispatch:
    inputs:
      group_id:
        description: "New group id, e.g. g2"
        required: true
      request_id:
        description: "Closed request id from deploy/groups/capacity-requests.json, or 'manual'"
        required: true
        default: manual
      confirm:
        description: "Type INSTALL CLOSED GROUP to spend cycles and create the services"
        required: true

permissions:
  contents: write

concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
    steps:
      - name: Confirm
        run: |
          test "${{ inputs.confirm }}" = "INSTALL CLOSED GROUP" || { echo "::error::Type INSTALL CLOSED GROUP to confirm"; exit 1; }
          echo "${{ inputs.group_id }}" | grep -Eq '^g[0-9]{1,3}$' || { echo "::error::group id must look like g2"; exit 1; }
          test "${{ inputs.group_id }}" != "g1" || { echo "::error::g1 is the live group"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install build tools (pinned)
        run: npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm ic-mops --no-fund --no-audit
      - name: Build group services
        working-directory: deploy/mainnet
        run: |
          set -euo pipefail
          icp build club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain \
            mini_league_domain media_metadata insights_domain notification_queue pii_access_control timer_jobs
          mkdir -p "$RUNNER_TEMP/wasm"
          for d in club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain \
                   mini_league_domain media_metadata insights_domain notification_queue pii_access_control timer_jobs; do
            f="$(find .icp/cache -type f \( -name '*.wasm' -o -name '*.wasm.gz' \) -path "*${d}*" | sort | tail -1)"
            test -n "$f" || { echo "::error::No build output for $d"; exit 1; }
            case "$f" in *.gz) cp "$f" "$RUNNER_TEMP/wasm/$d.wasm.gz";; *) cp "$f" "$RUNNER_TEMP/wasm/$d.wasm";; esac
            echo "$d <- $f"
          done
      - name: Install frontend dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Write operator key
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PEM" || { echo "::error::DEPLOYER_PEM secret missing"; exit 1; }
          umask 077
          printf '%s' "$DEPLOYER_PEM" | tr -d '\r' | sed 's/\\n/\n/g' | sed -n '/-----BEGIN/,/-----END/p' > "$RUNNER_TEMP/operator.pem"
      - name: Install group (closed)
        working-directory: frontend
        env:
          PUSH_WORKER_PRINCIPAL: ${{ vars.PUSH_WORKER_PRINCIPAL }}
          REQUEST_ID: ${{ inputs.request_id }}
          APPROVED_BY: ${{ github.actor }}
          WASM_DIR: ${{ runner.temp }}/wasm
        run: npx --yes tsx@4 scripts/install-group-closed.ts "${{ inputs.group_id }}" "$RUNNER_TEMP/operator.pem"
      - name: Save progress
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/operator.pem"
          git config user.name "ignite-operator"; git config user.email "operator@users.noreply.github.com"
          git add "deploy/groups/${{ inputs.group_id }}" && git commit -m "Closed group ${{ inputs.group_id }} install progress" && git push || true
