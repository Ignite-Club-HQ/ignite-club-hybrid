# Ignite web app → ICP frontend canister (replaces Netlify file hosting).
#
# Runs on every push to main that touches the frontend, or manually.
# Uses the same DEPLOYER_PEM secret as "Deploy ICP canisters (mainnet)".
# The first run creates the canister (~0.5T cycles from the deployer's cycles
# balance) and commits deploy/frontend/.icp/data/mappings/ic.ids.json so later
# runs reuse it. The site is then live at https://<canister-id>.icp.net.
#
# Optional repository variables (Settings → Variables): IGNITE_LIVE_SUPABASE_URL,
# IGNITE_LIVE_SUPABASE_ANON_KEY (both public values; defaults below).

name: Deploy web app (ICP frontend canister)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["frontend/**", "deploy/frontend/**", "!frontend/scripts/**", "!frontend/**/*.test.*", "!frontend/**/*.md"]

concurrency:
  group: deploy-frontend-canister
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
      # Large bundles need more than the default 60s plugin compute limit.
      ICP_CLI_PLUGIN_COMPUTE_LIMIT_SECS: "1800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install deploy tools
        run: npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm --no-fund --no-audit

      - name: Build web app
        working-directory: frontend
        env:
          IGNITE_LIVE_BUILD: "1"
          IGNITE_LIVE_SUPABASE_URL: ${{ vars.IGNITE_LIVE_SUPABASE_URL || 'https://cdrxmelhysdqrccttsjg.supabase.co' }}
          IGNITE_LIVE_SUPABASE_ANON_KEY: ${{ vars.IGNITE_LIVE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcnhtZWxoeXNkcXJjY3R0c2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzIxMTMsImV4cCI6MjEwNjE0ODExM30.vRVXXZuoh-9VliT7vt6lw2nANooLwlgOeyfBTFLQjXw' }}
        run: |
          set -euo pipefail
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(cat ../deploy/mainnet/.icp/data/mappings/ic.ids.json | tr -d '\n ')"
          npm ci --ignore-scripts --no-fund --no-audit
          node ../scripts/sync-canister-ids.mjs || true
          npm run build:live
          node scripts/prepare-canister-dist.mjs
          # The static-site plugin may only read files inside deploy/frontend.
          rm -rf ../deploy/frontend/dist
          cp -r dist-canister ../deploy/frontend/dist

      # No asset-history carry-over: it re-stamped old files on every deploy so
      # they never aged out and the upload grew to ~34k files (one build is ~600).
      # Tabs left open on an old version recover via lazyWithRetry's reload.
      - name: Report upload size
        run: |
          echo "Files in this deploy: $(find deploy/frontend/dist -type f | wc -l)"

      - name: Restore deployer identity
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYER_PEM" ]; then
            echo "::error::DEPLOYER_PEM secret missing — run the mainnet canister workflow first."
            exit 1
          fi
          mkdir -p "$ICP_HOME/identity/keys"
          PEM_FILE="$ICP_HOME/identity/keys/ignite-governor.pem"
          printf '%s' "$DEPLOYER_PEM" | tr -d '\r' | sed 's/\\n/\n/g' \
            | sed -n '/-----BEGIN/,/-----END/p' > "$PEM_FILE"
          icp identity import --from-pem "$PEM_FILE" --storage plaintext ignite-governor
          icp identity default ignite-governor
          echo "Deployer: $(icp identity principal)"

      - name: Convert any ICP into cycles
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/icp-no-project" && cd "$RUNNER_TEMP/icp-no-project"
          echo "Cycles balance: $(icp cycles balance -n ic 2>/dev/null || true)"
          RAW="$(icp token balance -n ic 2>/dev/null || true)"
          echo "ICP balance: $RAW"
          AMT="$(echo "$RAW" | grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || true)"
          MINT="$(awk -v b="${AMT:-0}" 'BEGIN{ m = b - 0.0001; if (m <= 0) m = 0; printf "%.8f", m }')"
          if [ "$MINT" != "0.00000000" ]; then
            echo "==> Converting $MINT ICP into cycles"
            icp cycles mint --icp "$MINT" -n ic
          fi
          echo "Cycles balance now: $(icp cycles balance -n ic 2>/dev/null || true)"

      - name: Upload to frontend canister
        working-directory: deploy/frontend
        run: |
          set -euo pipefail
          # Make sure the canister has room to install/upload (it ran dry once).
          # Try smaller amounts if the deploy account is short on cycles.
          # Only spend deploy-account cycles when the website canister is actually low;
          # topping up on every push drained the account shared with tests and group funding.
          FUEL=$(icp canister status frontend -e ic --json 2>/dev/null | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{let v=null;const walk=o=>{if(o&&typeof o==="object")for(const[k,x]of Object.entries(o)){if(v===null&&/^(cycles|balance|cycles_balance)$/i.test(k)&&/^\d[\d_]*$/.test(String(x).replace(/ cycles$/,"")))v=String(x).replace(/[_ a-z]/gi,"");else walk(x)}};try{walk(JSON.parse(t))}catch{};console.log(v??"")})' || true)
          TOPPED=""
          AMOUNTS="0.3T 0.15T 0.1T 0.05T"
          if [ -n "$FUEL" ] && [ "$FUEL" -ge 2000000000000 ] 2>/dev/null; then
            echo "Website canister holds $FUEL cycles; no top-up needed."; AMOUNTS=""; TOPPED="skipped"
          elif [ -z "$FUEL" ]; then
            echo "::warning::Could not read website canister fuel; topping up minimally."; AMOUNTS="0.05T"
          fi
          for A in $AMOUNTS; do
            if icp canister top-up frontend --amount "$A" -e ic; then TOPPED="$A"; echo "Topped up $A"; break; fi
          done
          [ -n "$TOPPED" ] || echo "::warning::Top-up skipped — the deploy account needs more cycles (send ICP to it)."
          # Sync calls require a running canister. A prior failed deploy left it
          # stopped, and a stopped canister refuses every call — start it first
          # and prove it is running before uploading. Never reinstall: that would
          # wipe the stored site.
          if [ -f .icp/data/mappings/ic.ids.json ] && jq -e '.frontend // empty' .icp/data/mappings/ic.ids.json >/dev/null; then
            echo "Ensuring frontend canister is running..."
            # "already running" is fine; only a real rejection matters.
            icp canister start frontend -e ic || true
            sleep 5
            STATUS_JSON="$(icp canister status frontend -e ic --json 2>/dev/null || true)"
            echo "Status after start: $STATUS_JSON"
            if echo "$STATUS_JSON" | grep -qi stopped; then
              # Start is rejected while the balance sits below the freezing
              # threshold; top up once and retry.
              echo "::warning::Canister still stopped — topping up 1T and retrying start."
              icp canister top-up frontend --amount 1T -e ic || true
              icp canister start frontend -e ic || true
              sleep 5
              STATUS_JSON="$(icp canister status frontend -e ic --json 2>/dev/null || true)"
              echo "Status after retry: $STATUS_JSON"
            fi
            if echo "$STATUS_JSON" | grep -qi stopped; then
              echo "::error::Frontend canister is stopped and would not start. Top it up with more cycles (Top up canister cycles workflow) and rerun this workflow."
              exit 1
            fi
          fi
          # Never reinterpret a sync failure as permission to erase stored files.
          icp deploy -e ic frontend --mode auto --yes --cycles 1000000000000
          ID="$(jq -r '.frontend' .icp/data/mappings/ic.ids.json)"
          # Let club_domain read this canister's cycle balance (admin settings panel).
          # Hard fail: without this grant the admin balances card cannot read the
          # web-app canister's cycles (it silently showed "—" once before).
          icp canister settings update frontend --add-controller mzzzv-taaaa-aaaal-qxlrq-cai -e ic --force
          echo "::notice::Web app live at https://$ID.icp.net"
          echo "### Web app deployed: https://$ID.icp.net" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit frontend canister ID
        run: |
          set -euo pipefail
          IDS="deploy/frontend/.icp/data/mappings/ic.ids.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f "$IDS"
          if git diff --cached --quiet; then echo "Mapping unchanged."; exit 0; fi
          git commit -m "Record frontend canister ID [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
