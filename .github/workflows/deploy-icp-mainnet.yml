# Ignite Club HQ — mainnet canister deploy, run from the GitHub Actions tab.
#
# One-time setup (in the GitHub repo, from any browser):
#   1. Fund the identity: the "Show funding address" step below prints the
#      account address — send ~8 ICP there. On the next run the
#      "Convert available ICP to cycles" step mints it into cycles
#      automatically (0.0001 ICP is left behind for the ledger fee).
#   2. On the FIRST run (no DEPLOYER_PEM secret yet), a fresh deployer key is
#      generated, every canister is pointed at it, and the key file is uploaded
#      as the "deployer-key" artifact. Download it, then:
#        Settings → Secrets and variables → Actions → New repository secret
#        Name: DEPLOYER_PEM
#        Value: the full .pem file text (-----BEGIN PRIVATE KEY----- included)
#      and delete the artifact afterwards.
# Then: Actions tab → "Deploy ICP canisters (mainnet)" → Run workflow.
# Safe to re-run; the canister ID table is attached as an artifact.

name: Deploy ICP canisters (mainnet)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install deploy tools (icp CLI, ic-wasm for the recipes, mops for Motoko)
        run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm ic-mops --no-fund --no-audit

      - name: Restore or create deployer identity
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$ICP_HOME/identity/keys"
          if [ -n "$DEPLOYER_PEM" ]; then
            printf '%s\n' "$DEPLOYER_PEM" | tr -d '\r' > "$ICP_HOME/identity/keys/ignite-governor.pem"
            icp identity import --from-pem "$ICP_HOME/identity/keys/ignite-governor.pem" --storage plaintext ignite-governor
            icp identity default ignite-governor
            echo "key_source=secret" >> "$GITHUB_ENV"
          else
            icp identity new ignite-governor --storage plaintext \
              --output-seed "$ICP_HOME/identity/keys/ignite-governor.seed.txt"
            icp identity default ignite-governor
            echo "key_source=generated" >> "$GITHUB_ENV"
          fi

      - name: Show funding address and balances
        run: |
          # Run balance queries from OUTSIDE the checkout: the committed local-lab
          # icp.yaml at the repo root makes even `icp token balance` try to load the
          # lab canisters' init-args files and die before touching the network.
          mkdir -p "$RUNNER_TEMP/icp-no-project" && cd "$RUNNER_TEMP/icp-no-project"
          echo "==> Fund this account address with ICP/cycles (icscan.io or an exchange):"
          icp identity account-id || true
          echo "==> Current balances:"
          icp token balance -n ic || true
          icp cycles balance -n ic || true

      - name: Convert available ICP to cycles
        run: |
          set -euo pipefail
          # Outside the checkout — see "Show funding address and balances" above.
          mkdir -p "$RUNNER_TEMP/icp-no-project" && cd "$RUNNER_TEMP/icp-no-project"
          RAW="$(icp token balance -n ic 2>/dev/null)"
          echo "ICP balance: $RAW"
          # Extract the first number, leave 0.0001 ICP behind for the ledger fee.
          AMT="$(echo "$RAW" | grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || true)"
          if [ -z "$AMT" ]; then
            echo "==> Could not parse ICP balance; skipping auto-conversion."
            echo "==> If deploy fails for lack of cycles, convert manually: icp cycles mint --icp <amount> -n ic"
            exit 0
          fi
          MINT="$(awk -v b="$AMT" 'BEGIN{ m = b - 0.0001; if (m <= 0) m = 0; printf "%.8f", m }')"
          if [ "$MINT" = "0.00000000" ]; then
            echo "==> No ICP to convert (balance $AMT). Deploy uses the existing cycles balance."
            exit 0
          fi
          echo "==> Minting $MINT ICP into cycles"
          icp cycles mint --icp "$MINT" -n ic
          icp cycles balance -n ic

      - name: Point all canister configs at this deployer identity
        run: |
          set -euo pipefail
          GOVERNOR="$(icp identity principal)"
          echo "Governor principal: $GOVERNOR"
          echo "GOVERNOR=$GOVERNOR" >> "$GITHUB_ENV"
          SENTINEL='gwyap-pqop5-msidu-vlkov-zuejr-7gqjr-dwvkx-2yhgy-mdaxt-2giwn-cae'
          grep -rl "$SENTINEL" backend deploy/mainnet scripts \
            | xargs -r sed -i "s|$SENTINEL|$GOVERNOR|g"

      - name: Deploy + wire all 18 canisters
        run: bash scripts/deploy-mainnet.sh

      - name: Print paste-ready canister ID table
        if: always()
        run: |
          IDS="deploy/mainnet/.icp/data/mappings/ic.ids.json"
          if [ -f "$IDS" ]; then
            echo "==> Paste into /admin/placement-settings → Canister configuration:"
            node -e "const m=require('./$IDS');for(const [k,v] of Object.entries(m)){const id=typeof v==='string'?v:(v.ic||v.id||Object.values(v)[0]);console.log(k+'\t'+id)}"
          fi

      - name: First-run key instructions
        if: always() && env.key_source == 'generated'
        run: |
          echo "==> FIRST RUN: a fresh deployer key was generated (governor principal $GOVERNOR)."
          echo "==> 1. Download the 'deployer-key' artifact from this run page (a .pem text file)."
          echo "==> 2. Repo → Settings → Secrets and variables → Actions → New repository secret"
          echo "     Name: DEPLOYER_PEM"
          echo "     Value: the full file text, -----BEGIN PRIVATE KEY----- line included."
          echo "==> 3. Delete the 'deployer-key' artifact from this run page after saving it."
          echo "==> 4. Send ~8 ICP to the account address printed above, then re-run."
          echo "     The workflow converts it to cycles automatically on the next run."

      - name: Upload canister ID mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canister-ids
          path: deploy/mainnet/.icp/data/mappings/ic.ids.json
          if-no-files-found: ignore

      - name: Upload generated deployer key (first run only)
        if: always() && env.key_source == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: deployer-key
          path: |
            ${{ env.ICP_HOME }}/identity/keys/ignite-governor.pem
            ${{ env.ICP_HOME }}/identity/keys/ignite-governor.seed.txt
          if-no-files-found: error
