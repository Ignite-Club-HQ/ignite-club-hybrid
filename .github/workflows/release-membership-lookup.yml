name: Release permanent club lookup (all groups)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Check or upgrade identity and every registered membership source plus original Group 1
        required: true
        type: choice
        default: check
        options: [check, upgrade]
      confirmation:
        description: Type RELEASE MEMBERSHIP LOOKUP for upgrade; empty for check
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate exact lookup release request
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node --input-type=module -e 'import {validateRequest,requireLookupReleaseAcceptance} from "./scripts/membership-lookup-release-policy.mjs"; validateRequest(process.env.ACTION,process.env.CONFIRMATION); if(process.env.ACTION === "upgrade") requireLookupReleaseAcceptance()'
      - name: Install pinned tools and existing dependencies
        run: |
          npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm ic-mops --no-fund --no-audit
          node scripts/ensure-frontend-deps.mjs
      - name: Test coverage, revision catch-up, restart and release boundaries
        run: node --test scripts/membership-lookup-recovery.test.mjs scripts/membership-acceptance-checks.test.mjs scripts/membership-lookup-release-policy.test.mjs scripts/membership-ownership-acceptance.test.mjs scripts/membership-source-configuration.test.mjs scripts/membership-legacy-ownership.test.mjs frontend/scripts/membership-fill-contract.test.mjs scripts/group2-journal.test.mjs scripts/group2-upgrade-rules.test.mjs
      - name: Restore existing governor only
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PEM"
          umask 077
          echo "ICP_HOME=$RUNNER_TEMP/lookup-icp-home" >> "$GITHUB_ENV"
          export ICP_HOME="$RUNNER_TEMP/lookup-icp-home"
          printf '%s' "$DEPLOYER_PEM" | tr -d '\r' | sed 's/\\n/\n/g' | sed -n '/-----BEGIN/,/-----END/p' > "$RUNNER_TEMP/lookup.pem"
          icp identity import --from-pem "$RUNNER_TEMP/lookup.pem" --storage plaintext ignite-governor
          icp identity default ignite-governor
          test "$(icp identity principal)" = vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build only lookup release artifacts
        working-directory: deploy/mainnet
        run: |
          set -euo pipefail
          icp build identity_access
          icp build club_domain
          mkdir -p "$RUNNER_TEMP/lookup-wasm"
          cp .icp/cache/artifacts/identity_access .icp/cache/artifacts/club_domain "$RUNNER_TEMP/lookup-wasm/"
      - name: Verify real consensus acceptance and snapshot restoration locally
        run: |
          set -euo pipefail
          cargo test -p identity_access --lib
          cargo build --release --target wasm32-unknown-unknown -p identity_access -p shard_router
          node frontend/node_modules/@dfinity/pic/postinstall.mjs
          SHARD_ROUTER_WASM="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/shard_router.wasm" IDENTITY_ACCESS_WASM="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/identity_access.wasm" CLUB_DOMAIN_WASM="$RUNNER_TEMP/lookup-wasm/club_domain" node frontend/scripts/test-membership-acceptance-replica.mjs
      - name: Check every membership source or run the protected lookup release
        working-directory: frontend
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: npx --yes tsx@4 scripts/release-membership-lookup.ts "$ACTION" "$RUNNER_TEMP/lookup-wasm" "$RUNNER_TEMP/lookup.pem" "$RUNNER_TEMP/lookup-report"
      - name: Resolve existing delivery identity
        if: inputs.action == 'upgrade'
        env:
          ICP_PUSH_WORKER_SEED: ${{ secrets.ICP_PUSH_WORKER_SEED }}
          PUSH_WORKER_PRINCIPAL: ${{ vars.PUSH_WORKER_PRINCIPAL }}
        run: bash scripts/resolve-group-push-worker.sh
      - name: Refresh governor-verified routing evidence
        if: inputs.action == 'upgrade'
        working-directory: frontend
        run: npx --yes tsx@4 scripts/produce-routing-gates.ts "$RUNNER_TEMP/lookup.pem" "$RUNNER_TEMP/lookup-report/routing-gates.json"
      - name: Save verified lookup fingerprints and routing snapshot
        if: inputs.action == 'upgrade'
        run: |
          set -euo pipefail
          git config user.name "ignite-governor-bot"
          git config user.email "noreply@igniteclubhq.app"
          git add deploy/groups/g2/general-opening.json frontend/src/live/generated/routingGates.ts
          git diff --cached --quiet || git commit -m "chore: verified club lookup release snapshot [skip ci]"
          git push
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lookup.pem"; rm -rf "$RUNNER_TEMP/lookup-icp-home"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-lookup-release-report
          path: ${{ runner.temp }}/lookup-report
          if-no-files-found: ignore
