# Codemagic CI for Ignite Club HQ native apps.
#
# Workflows:
#   android-debug   — unsigned debug APK, no secrets needed. Use this first to
#                     prove the pipeline end to end.
#   android-release — signed AAB for Google Play. Requires the environment
#                     variables listed below to be configured in the Codemagic
#                     UI (Application -> Environment variables, group
#                     "android_release"):
#                       CM_KEYSTORE            base64 of the upload keystore (.jks)
#                       CM_KEYSTORE_PASSWORD   keystore store password
#                       CM_KEY_ALIAS           key alias inside the keystore
#                       CM_KEY_PASSWORD        key password
#                       GOOGLE_SERVICES_JSON   base64 of google-services.json
#                                              (Firebase project used for push)
#   ios-debug       — unsigned simulator build, no Apple account needed. Use this
#                     to prove the iOS pipeline before touching any Apple secrets.
#   ios-release     — signed App Store IPA. Requires an Apple Developer Program
#                     membership and an "app_store_connect" integration in the
#                     Codemagic team settings (Issuer ID + Key ID + the .p8 key
#                     downloaded from App Store Connect -> Users and Access ->
#                     Integrations -> App Store Connect API, App Manager access).
#                     Optional group "ios_release":
#                       GOOGLE_SERVICE_INFO_PLIST  base64 of GoogleService-Info.plist
#                                                  (Firebase, for push on iOS)
#
# All workflows build the live web app (frontend/scripts/build-live.mjs ->
# frontend/dist-live), scaffold the Capacitor native project in CI (android/ and
# ios/ are intentionally NOT committed), sync, then build natively.
#
# NOTE on the install step: scripts/ensure-frontend-deps.mjs lives at the repo
# root, not inside frontend/. It resolves frontend/ itself, so it must be run
# from the repo root — running it with working_directory: frontend fails with
# "Cannot find module".

workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://cdrxmelhysdqrccttsjg.supabase.co}"
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcnhtZWxoeXNkcXJjY3R0c2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzIxMTMsImV4cCI6MjEwNjE0ODExM30.vRVXXZuoh-9VliT7vt6lw2nANooLwlgOeyfBTFLQjXw}"
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          if [ -f ../deploy/mainnet/.icp/data/mappings/ic.ids.json ]; then
            export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(cat ../deploy/mainnet/.icp/data/mappings/ic.ids.json | tr -d '\n ')"
          fi
          npm run build:live
      - name: Scaffold and sync Capacitor Android
        working_directory: frontend
        script: |
          npx cap add android
          npx cap sync android
          # Optional: notifications in the test build when the Firebase file is set.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
               '<category android:name="android.intent.category.DEFAULT" />'
               '<category android:name="android.intent.category.BROWSABLE" />'
               '<data android:scheme="com.igniteclubhq.app" android:host="ii-callback" /></intent-filter>')
          if "com.igniteclubhq.app" not in s:
              s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w").write(s)
          PY
      - name: Build debug APK
        working_directory: frontend/android
        script: ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/debug/*.apk

  android-release:
    name: Android release AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      groups:
        - android_release
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://cdrxmelhysdqrccttsjg.supabase.co}"
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcnhtZWxoeXNkcXJjY3R0c2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzIxMTMsImV4cCI6MjEwNjE0ODExM30.vRVXXZuoh-9VliT7vt6lw2nANooLwlgOeyfBTFLQjXw}"
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          if [ -f ../deploy/mainnet/.icp/data/mappings/ic.ids.json ]; then
            export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(cat ../deploy/mainnet/.icp/data/mappings/ic.ids.json | tr -d '\n ')"
          fi
          npm run build:live
      - name: Scaffold and sync Capacitor Android
        working_directory: frontend
        script: |
          npx cap add android
          npx cap sync android
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
               '<category android:name="android.intent.category.DEFAULT" />'
               '<category android:name="android.intent.category.BROWSABLE" />'
               '<data android:scheme="com.igniteclubhq.app" android:host="ii-callback" /></intent-filter>')
          if "com.igniteclubhq.app" not in s:
              s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w").write(s)
          PY
      - name: Decode signing and Firebase files
        working_directory: frontend/android
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > app/upload-keystore.jks
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: Configure signing
        working_directory: frontend/android
        script: |
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('CM_KEY_ALIAS')
                      keyPassword System.getenv('CM_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build release AAB
        working_directory: frontend/android
        script: ./gradlew bundleRelease
    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab

  # Proves the iOS toolchain without needing an Apple Developer account: builds
  # the app for the simulator with code signing switched off. The .app cannot be
  # installed on a real phone — it is a pipeline check only.
  ios-debug:
    name: iOS debug build (simulator, unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://cdrxmelhysdqrccttsjg.supabase.co}"
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcnhtZWxoeXNkcXJjY3R0c2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzIxMTMsImV4cCI6MjEwNjE0ODExM30.vRVXXZuoh-9VliT7vt6lw2nANooLwlgOeyfBTFLQjXw}"
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          if [ -f ../deploy/mainnet/.icp/data/mappings/ic.ids.json ]; then
            export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(cat ../deploy/mainnet/.icp/data/mappings/ic.ids.json | tr -d '\n ')"
          fi
          npm run build:live
      - name: Scaffold and sync Capacitor iOS
        working_directory: frontend
        script: |
          npx cap add ios
          npx cap sync ios
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.igniteclubhq.app" "$PL"
      - name: Build for simulator (no signing)
        working_directory: frontend/ios/App
        script: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS release IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the name of the App Store Connect integration created in
      # Codemagic team settings.
      app_store_connect: ignite
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.igniteclubhq.app
      groups:
        - ios_release
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect -> App -> General -> App Information -> the numeric
        # Apple ID. Fill this in once the app record exists.
        APP_STORE_APP_ID: 0000000000
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://cdrxmelhysdqrccttsjg.supabase.co}"
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkcnhtZWxoeXNkcXJjY3R0c2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzIxMTMsImV4cCI6MjEwNjE0ODExM30.vRVXXZuoh-9VliT7vt6lw2nANooLwlgOeyfBTFLQjXw}"
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          if [ -f ../deploy/mainnet/.icp/data/mappings/ic.ids.json ]; then
            export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(cat ../deploy/mainnet/.icp/data/mappings/ic.ids.json | tr -d '\n ')"
          fi
          npm run build:live
      - name: Scaffold and sync Capacitor iOS
        working_directory: frontend
        script: |
          npx cap add ios
          npx cap sync ios
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.igniteclubhq.app" "$PL"
      - name: Install CocoaPods dependencies
        working_directory: frontend/ios/App
        script: pod install
      - name: Wire Firebase push (iOS)
        working_directory: frontend
        script: bash ../scripts/native-push-ios.sh
      - name: Increment build number
        working_directory: frontend/ios/App
        script: |
          agvtool new-version -all $((${CM_BUILD_NUMBER:-1}))
          agvtool new-marketing-version 1.0.$(${CM_BUILD_NUMBER:-1})
      - name: Set up code signing
        working_directory: frontend/ios/App
        script: xcode-project use-profiles
      - name: Build App Store IPA
        working_directory: frontend/ios/App
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
