# Ignite web app hosted on an ICP certified-assets canister.
# Kept as its own project (separate from deploy/mainnet) so the frontend
# canister never lands in the app's backend canister ID table.
# Build first: cd frontend && npm run build:live && node scripts/prepare-canister-dist.mjs
# Deploy:      cd deploy/frontend && icp deploy -e ic
# Workflow:    .github/workflows/deploy-frontend-canister.yml
canisters:
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: ../../frontend/dist-canister

environments:
  - name: ic
    network: ic
    canisters:
      - frontend
