<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f1512" />
  <title>Sign in – Ignite Club HQ</title>
  <style>
    :root { color-scheme: dark; --background: #0f1512; --foreground: #f2f7f4; --muted: #a7b9ae; --primary: #34d399; --primary-foreground: #06271a; --error: #fda4af; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--background); color: var(--foreground); }
    main { width: 100%; max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    .logo { margin: 0 auto 1rem; width: 64px; height: 64px; border-radius: 16px; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 32px rgba(52, 211, 153, .35); }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 1.5rem; }
    #go, #back { display: block; width: 100%; box-sizing: border-box; padding: .9rem 1rem; border: 0; border-radius: 10px; font: inherit; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; }
    #go, #back.btn { background: var(--primary); color: var(--primary-foreground); }
    #back.secondary { margin-top: .75rem; background: transparent; color: var(--muted); font-weight: 500; font-size: .9rem; }
    #go:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .err { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#06271a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    </div>
    <h1 id="title">Sign in to Ignite Club HQ</h1>
    <p id="msg" role="status" aria-live="polite">Getting sign-in ready…</p>
    <button id="go" type="button" hidden>Continue</button>
    <a id="back" class="secondary" hidden>Cancel and go back to the app</a>
  </main>
  <script src="/native-sign-in.js"></script>
</body>
</html>
