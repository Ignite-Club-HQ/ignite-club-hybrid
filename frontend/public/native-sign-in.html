<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in – Ignite Club HQ</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1115; color: #f2f2f2; }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { color: #b8b8b8; line-height: 1.45; margin: 0 0 1.5rem; }
    button, a.btn { display: block; width: 100%; box-sizing: border-box; padding: .9rem 1rem; border: 0; border-radius: .75rem; background: #ff6a1a; color: #fff; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; }
    .hidden { display: none; }
    .err { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <img src="/ignite-icon.png" alt="" width="64" height="64" />
    <h1 id="title">Sign in to Ignite Club HQ</h1>
    <p id="msg">Tap continue to confirm it's you. You'll go straight back to the app afterwards.</p>
    <button id="go" type="button">Continue</button>
    <a id="back" class="btn hidden" href="#">Back to the app</a>
  </main>
  <script src="/native-sign-in.js"></script>
</body>
</html>
